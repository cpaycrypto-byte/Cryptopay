<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Shield Hexagon -->
  <polygon points="50,6 88,24 88,68 50,94 12,68 12,24" stroke="url(#shieldGrad)" stroke-width="4" fill="#0B132B" fill-opacity="0.85" filter="url(#glow)" />
  <polygon points="50,14 80,29 80,63 50,85 20,63 20,29" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  
  <!-- Blockchain Circuit Lines -->
  <line x1="50" y1="20" x2="50" y2="38" stroke="#00F0FF" stroke-width="2.5" />
  <line x1="28" y1="36" x2="42" y2="45" stroke="#6366F1" stroke-width="2" />
  <line x1="72" y1="36" x2="58" y2="45" stroke="#6366F1" stroke-width="2" />
  <line x1="32" y1="62" x2="50" y2="76" stroke="#00F0FF" stroke-width="2" />
  <line x1="68" y1="62" x2="50" y2="76" stroke="#00F0FF" stroke-width="2" />
  
  <!-- Circuit Nodes -->
  <circle cx="50" cy="20" r="3.5" fill="#00F0FF" />
  <circle cx="28" cy="36" r="3.5" fill="#6366F1" />
  <circle cx="72" cy="36" r="3.5" fill="#6366F1" />
  <circle cx="32" cy="62" r="3.5" fill="#10B981" />
  <circle cx="68" cy="62" r="3.5" fill="#10B981" />
  <circle cx="50" cy="76" r="4" fill="#00F0FF" />

  <!-- Center 'C' / Crypto Diamond -->
  <path d="M57 38 C54 35 44 35 41 42 C38 49 38 55 42 61 C46 66 54 66 57 62" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <line x1="35" y1="50" x2="62" y2="50" stroke="url(#nodeGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
